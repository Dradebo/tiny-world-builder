name: WNN Preview Pages

on:
  push:
    branches:
      - feat/wnn-previs-spike
    paths:
      - 'wnn-previs/**'
      - '.github/workflows/wnn-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wnn-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install
        working-directory: wnn-previs
        run: npm install
      - name: Build
        working-directory: wnn-previs
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wnn-previs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
