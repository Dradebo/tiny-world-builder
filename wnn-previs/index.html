<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WNN Previs</title>
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <div>
          <p class="eyebrow">WNN / PREVIS v0</p>
          <h1>Walk into shoot day with the show already directed.</h1>
          <p class="hint">A shopfront gathering point, not a designed bar.</p>
        </div>

        <section>
          <h2>Camera</h2>
          <div id="cameraButtons" class="buttonGrid"></div>
        </section>

        <section>
          <h2>Lighting</h2>
          <div class="row">
            <button data-light="NORMAL" class="active">Normal</button>
            <button data-light="LONG_ONE">Long one</button>
            <button data-light="WITNESS_SHOCK">Witness shock</button>
          </div>
        </section>

        <section>
          <h2>Frame</h2>
          <div class="row">
            <button data-aspect="16:9" class="active">16:9</button>
            <button data-aspect="9:16">9:16</button>
          </div>
        </section>

        <section>
          <h2>Scene</h2>
          <button id="resetScene">Reset</button>
          <button id="saveScene">Save</button>
          <button id="loadScene">Load</button>
        </section>

        <section>
          <h2>Edit props</h2>
          <div class="row">
            <button data-transform="translate" class="active">Move</button>
            <button data-transform="rotate">Rotate</button>
            <button data-transform="scale">Scale</button>
          </div>
          <p id="selection">Nothing selected</p>
        </section>

        <section>
          <h2>Optional prop</h2>
          <label class="fileButton">
            Import GLB
            <input id="modelInput" type="file" accept=".glb" />
          </label>
        </section>
      </aside>

      <main id="viewport">
        <div id="frameGuide" class="frameGuide landscape"></div>
        <div class="shotBug">
          <span id="shotName">MASTER</span>
          <span id="lightName">NORMAL</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
